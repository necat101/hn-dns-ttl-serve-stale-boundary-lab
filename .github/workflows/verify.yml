name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m py_compile generate_cases.py evaluate.py run_lab.py tests/test_lab.py
      - run: python3 generate_cases.py
      - run: python3 evaluate.py
      - run: python3 run_lab.py
      - run: python3 tests/test_lab.py
